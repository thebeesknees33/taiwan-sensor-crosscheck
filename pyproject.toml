[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-sensor-crosscheck"
version = "0.1.0"
description = "Cross-validate independent public data streams about Taiwan (first: USGS vs CWA earthquakes)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crosscheck = "crosscheck.cli:main"

[tool.setuptools.packages.find]
include = ["crosscheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
